services:
  postgres:
    container_name: scheduling-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduling
    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"
    volumes:
      - scheduling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduling"]
      interval: 5s
      timeout: 5s
      retries: 5

  scheduling-backend:
    container_name: scheduling-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5009:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/scheduling
      USE_MOCK_DATA: ${USE_MOCK_DATA:-true}
      ATTENDANCE_BASE_URL: ${ATTENDANCE_BASE_URL:-http://host.docker.internal:5008}
      LOCATION_BASE_URL: ${LOCATION_BASE_URL:-http://host.docker.internal:5005}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://host.docker.internal:5001}
      HTTP_TIMEOUT_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  scheduling_pgdata:
